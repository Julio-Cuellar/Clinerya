# Escaneo de vulnerabilidades en dependencias (backend y frontend).
#
# Va aparte de ci.yml por lo mismo que secret-scan.yml: ci.yml solo corre en "main" y
# "Cuellar", y ademas este job debe poder correr en agenda propia — una dependencia no
# cambia, pero la base de CVEs si: algo que hoy sale limpio puede salir vulnerable en
# dos semanas sin que nadie toque el codigo.
name: Dependency scan

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # Lunes 09:00 UTC (03:00 CDMX).
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Genera el arbol de dependencias resuelto y lo pasa a osv-scanner, que consulta
      # OSV.dev. Se prefiere sobre dependency-check porque no necesita la descarga inicial
      # de la base de datos del NVD (lenta y con limites de rate sin API key).
      - name: Resolve dependency tree
        run: mvn -B -q dependency:tree -DoutputFile=maven-dependency-tree.txt -DoutputType=text

      - name: Scan with osv-scanner
        # Sin pin a un patch fijo: google/osv-scanner-action dejo de publicar el tag
        # flotante "v2" (solo hay versiones completas), asi que "@v2" no resuelve.
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=pom.xml:./pom.xml
            --recursive
            ./

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinerya-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clinerya-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Falla solo con vulnerabilidades altas o criticas: las moderadas en devDependencies
      # no llegan al bundle que se sirve y romperian el build sin aportar señal.
      - name: npm audit
        run: npm audit --audit-level=high
