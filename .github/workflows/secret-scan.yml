# Escaneo de secretos (gitleaks).
#
# Va en un workflow aparte de ci.yml a proposito: ci.yml solo corre en "main" y
# "Cuellar", y un escaneo de secretos tiene que correr en TODAS las ramas y PRs
# para que el secreto se detecte antes de llegar a main, no despues.
#
# Nota: gitleaks-action es gratuito para repos de cuentas personales. Si algun dia
# mueves el repo a una organizacion de GitHub, necesitaras GITLEAKS_LICENSE.
name: Secret scan

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: permite detectar secretos en commits previos

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
