# Perfil solo para desarrollo local fuera de Docker (IDE, `mvn spring-boot:run`, etc.).
# Actívalo con SPRING_PROFILES_ACTIVE=local. Nunca se carga a menos que lo actives explícitamente,
# así que estos valores de ejemplo no representan ningún riesgo en producción (que corre con
# SPRING_PROFILES_ACTIVE=prod vía docker-compose, con sus propios secretos reales en .env).
spring:
  datasource:
    password: root

jwt:
  secret: local-dev-only-secret-do-not-use-in-production-1234567890ABCDEFGH

medicloud:
  security:
    # OJO: debe coincidir con el valor que traía application.yml antes de quitar el fallback
    # (DefaultSecretEncryptionKey32Chars!). Si tu base de datos local ya tiene columnas cifradas
    # (ENC_GCM:...) con esa clave -p. ej. credenciales de Google Calendar- cambiar este valor
    # rompe el descifrado de esos datos existentes (Tag mismatch en AesCryptoConverter).
    encryption-key: DefaultSecretEncryptionKey32Chars!
    # Sin TLS en local: una cookie Secure no la manda el navegador y el refresh nunca llega.
    secure-cookies: false

google:
  oauth:
    state-secret: local-dev-only-google-oauth-state-secret

# Fase de pruebas: cada arranque borra la base de datos, la recrea con las migraciones y vuelve a
# sembrar las cuentas demo y showcase (ver DevDatabaseResetConfig). Si necesitas conservar datos
# entre reinicios, arranca con APP_FLYWAY_RESET_ON_STARTUP=false.
app:
  flyway:
    reset-on-startup: ${APP_FLYWAY_RESET_ON_STARTUP:true}
  dev-seed:
    enabled: true
  showcase-seed:
    enabled: true
