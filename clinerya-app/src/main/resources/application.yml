spring:
  application:
    name: clinerya-application
  datasource:
    url: ${MEDICLOUD_DB_URL:jdbc:postgresql://localhost:5432/medicloud}
    username: ${MEDICLOUD_DB_USERNAME:postgres}
    password: ${MEDICLOUD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}



jwt:
  secret: ${JWT_SECRET}
  # 30 min. El frontend renueva solo con el refresh token al recibir un 401, asi que una
  # vigencia corta no se nota en uso normal y acota la ventana de un token robado.
  expiration: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  email:
    from: ${APP_EMAIL_FROM:no-reply@clinerya.local}
    verification:
      enabled: ${APP_EMAIL_VERIFICATION_ENABLED:false}
  file-upload:
    directory: ${APP_FILE_UPLOAD_DIRECTORY:./uploads}
  backup:
    pg-dump-path: ${APP_BACKUP_PG_DUMP_PATH:/usr/bin/pg_dump}
  # Los seeds crean cuentas activas con contrasena conocida y publicada en este archivo.
  # Por eso el default es false: solo se habilitan de forma explicita en local/demo,
  # nunca por omision al arrancar fuera de docker-compose.
  dev-seed:
    enabled: ${APP_DEV_SEED_ENABLED:false}
    email: ${APP_DEV_SEED_EMAIL:demo@medicloud.local}
    password: ${APP_DEV_SEED_PASSWORD:Demo12345!}
    full-name: ${APP_DEV_SEED_FULL_NAME:Doctora Demo}
    clinic-name: ${APP_DEV_SEED_CLINIC_NAME:Clinica Demo}
  showcase-seed:
    enabled: ${APP_SHOWCASE_SEED_ENABLED:false}
    email: ${APP_SHOWCASE_SEED_EMAIL:showcase@medicloud.local}
    password: ${APP_SHOWCASE_SEED_PASSWORD:Showcase12345!}
    full-name: ${APP_SHOWCASE_SEED_FULL_NAME:Dra. Elena Martinez}
    clinic-name: ${APP_SHOWCASE_SEED_CLINIC_NAME:Clinica Dental Aurora}
  audit:
    outbox:
      batch-size: ${APP_AUDIT_OUTBOX_BATCH_SIZE:200}
      dispatch-delay-ms: ${APP_AUDIT_OUTBOX_DISPATCH_DELAY_MS:500}
      initial-delay-ms: ${APP_AUDIT_OUTBOX_INITIAL_DELAY_MS:1000}
      metrics-refresh-delay-ms: ${APP_AUDIT_OUTBOX_METRICS_REFRESH_DELAY_MS:10000}
      health:
        max-pending: ${APP_AUDIT_OUTBOX_MAX_PENDING:5000}
        max-oldest-age-seconds: ${APP_AUDIT_OUTBOX_MAX_AGE_SECONDS:300}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      status:
        order: down,out-of-service,degraded,unknown,up
        http-mapping:
          degraded: 200

logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
    org.springframework.web: ${SPRING_WEB_LOG_LEVEL:INFO}

medicloud:
  security:
    # Proxies que anaden su salto a X-Forwarded-For (Caddy o nginx delante del backend).
    # Lo usa RateLimitingFilter para saber que entrada de la cabecera es de fiar.
    trusted-proxy-count: ${APP_TRUSTED_PROXY_COUNT:1}
    # Sin fallback a proposito: si falta la variable, la aplicacion NO debe arrancar.
    # Un default aqui significaria cifrar datos clinicos con una llave publicada en el
    # repositorio. Para desarrollo local usa application-local.yml (SPRING_PROFILES_ACTIVE=local).
    # OJO: cambiar este valor rompe el descifrado de las columnas ENC_GCM: existentes.
    encryption-key: ${MEDICLOUD_ENCRYPTION_KEY}
    # Directorio (fuera de /app/uploads, e idealmente respaldado) donde FieldCipher
    # persiste .field-key cuando el contenedor no monta /run/secrets/machine_id.
    # Debe montarse como volumen dedicado en produccion.
    key-store-dir: ${MEDICLOUD_KEY_STORE_DIR:/app/secrets}
    # Cookie del refresh token: Secure exige HTTPS. Solo se desactiva en application-local.yml
    # (desarrollo local sin TLS); produccion siempre corre detras de Caddy con TLS.
    secure-cookies: ${MEDICLOUD_SECURE_COOKIES:true}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8082/api/v1/integrations/google-calendar/callback}
    state-secret: ${GOOGLE_OAUTH_STATE_SECRET}
  calendar:
    default-timezone: ${GOOGLE_CALENDAR_DEFAULT_TIMEZONE:America/Mexico_City}
